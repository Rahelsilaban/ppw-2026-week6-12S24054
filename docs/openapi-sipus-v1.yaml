openapi: 3.0.3
info:
  title: SIPUS-Del Web API & SOAP Services
  description: >-
    Dokumentasi resmi Kontrak OpenAPI 3.0 untuk Sistem Informasi Perpustakaan
    Institut Teknologi Del (SIPUS-Del) Tahap 3. Mencakup layanan SOAP Web Service
    Bebas Pustaka dan RESTful API Provider (Katalog Buku, Autentikasi Sanctum,
    Transaksi ACID Peminjaman, HATEOAS, RFC 7807 Problem Details, dan OpenLibrary Consumer).
  version: 1.0.0
  contact:
    name: Rahel Silaban (12S24054)
    email: rahelj.e.silaban23@gmail.com
servers:
  - url: http://127.0.0.1:8000
    description: Server Lokal Pengembangan (Development Server)

tags:
  - name: SOAP Web Service
    description: Integrasi sistem bebas pustaka berbasis XML SOAP 1.1 dan kontrak WSDL
  - name: Autentikasi Sanctum
    description: Manajemen session token stateless pustakawan
  - name: Katalog Buku
    description: Layanan CRUD katalog buku publik dan privat dengan HATEOAS
  - name: Transaksi Peminjaman ACID
    description: Layanan sirkulasi peminjaman dan pengembalian buku berintegritas tinggi
  - name: REST Consumer
    description: Integrasi metadata buku eksternal OpenLibrary API

paths:
  /soap/sipus.wsdl:
    get:
      tags:
        - SOAP Web Service
      summary: Mengambil Dokumen Kontrak WSDL
      description: Menampilkan kontrak XML WSDL 1.1 untuk operasi CheckClearanceStatus.
      responses:
        '200':
          description: Dokumen kontrak WSDL berhasil disajikan.
          content:
            text/xml:
              schema:
                type: string
                example: '<?xml version="1.0" encoding="UTF-8"?><definitions ...></definitions>'

  /soap/sipus:
    post:
      tags:
        - SOAP Web Service
      summary: Eksekusi Operasi SOAP Bebas Pustaka
      description: Menerima SOAP Envelope untuk memeriksa kelayakan bebas pustaka mahasiswa berdasarkan NIM.
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:sip="http://sipus.del.ac.id/soap">
                   <soapenv:Header/>
                   <soapenv:Body>
                      <sip:CheckClearanceStatusRequest>
                         <sip:nim_peminjam>12S24054</sip:nim_peminjam>
                      </sip:CheckClearanceStatusRequest>
                   </soapenv:Body>
                </soapenv:Envelope>
      responses:
        '200':
          description: Status bebas pustaka berhasil dihitung.
          content:
            text/xml:
              schema:
                type: string
                example: |
                  <?xml version="1.0" encoding="UTF-8"?>
                  <SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/" xmlns:tns="http://sipus.del.ac.id/soap">
                      <SOAP-ENV:Body>
                          <tns:CheckClearanceStatusResponse>
                              <nim_peminjam>12S24054</nim_peminjam>
                              <nama_peminjam>Rahel Silaban</nama_peminjam>
                              <active_loans>0</active_loans>
                              <is_cleared>true</is_cleared>
                              <message>Mahasiswa dinyatakan bebas pustaka (tidak ada pinjaman aktif).</message>
                          </tns:CheckClearanceStatusResponse>
                      </SOAP-ENV:Body>
                  </SOAP-ENV:Envelope>
        '500':
          description: SOAP Fault (XML cacat, NIM kosong, atau gangguan server).
          content:
            text/xml:
              schema:
                type: string
                example: |
                  <?xml version="1.0" encoding="UTF-8"?>
                  <SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/">
                      <SOAP-ENV:Body>
                          <SOAP-ENV:Fault>
                              <faultcode>SOAP-ENV:Client</faultcode>
                              <faultstring>Parameter nim_peminjam wajib disertakan dan tidak boleh kosong.</faultstring>
                          </SOAP-ENV:Fault>
                      </SOAP-ENV:Body>
                  </SOAP-ENV:Envelope>

  /api/v1/auth/login:
    post:
      tags:
        - Autentikasi Sanctum
      summary: Login Pustakawan dan Penerbitan Bearer Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: pustakawan@del.ac.id
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Autentikasi berhasil dan token diterbitkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '401':
          description: Kredensial tidak valid (RFC 7807).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/me:
    get:
      tags:
        - Autentikasi Sanctum
      summary: Melihat Profil Pemilik Token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil pemilik token aktif.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    type: object
                    properties:
                      id: { type: integer, example: 1 }
                      name: { type: string, example: Pustakawan Del }
                      email: { type: string, example: pustakawan@del.ac.id }
        '401':
          description: Token tidak valid atau tidak disertakan.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/logout:
    post:
      tags:
        - Autentikasi Sanctum
      summary: Mencabut Bearer Token Aktif
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token berhasil dicabut.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Bearer token berhasil dicabut. Logout berhasil. }
        '401':
          description: Tidak terautentikasi.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/bukus:
    get:
      tags:
        - Katalog Buku
      summary: Mengambil Katalog Buku Publik
      parameters:
        - name: search
          in: query
          description: Kata kunci pencarian judul, penulis, atau ISBN
          schema: { type: string }
        - name: kategori_id
          in: query
          description: Filter berdasarkan ID kategori
          schema: { type: integer }
        - name: tersedia
          in: query
          description: Filter buku dengan stok > 0 jika bernilai '1'
          schema: { type: string, enum: ['1'] }
        - name: sort
          in: query
          description: Pengurutan data katalog
          schema:
            type: string
            enum: [judul_asc, judul_desc, tahun_terbit_asc, tahun_terbit_desc, stok_asc, stok_desc]
        - name: page
          in: query
          description: Nomor halaman pagination
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          description: Jumlah baris per halaman
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Daftar katalog buku berhasil dimuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BukuResource'
                  links: { type: object }
                  meta: { type: object }

    post:
      tags:
        - Katalog Buku
      summary: Menambahkan Judul Buku Baru
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '201':
          description: Buku berhasil dibuat. Mengembalikan header Location.
          headers:
            Location:
              schema: { type: string }
              description: URI detail buku yang baru dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BukuResource'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '422':
          $ref: '#/components/responses/UnprocessableProblem'

  /api/v1/bukus/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags:
        - Katalog Buku
      summary: Mengambil Detail Satu Buku
      responses:
        '200':
          description: Detail buku ditemukan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BukuResource'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

    put:
      tags:
        - Katalog Buku
      summary: Full Replacement Data Buku
      description: Menggantikan seluruh atribut buku. Seluruh field wajib dikirimkan.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '200':
          description: Seluruh atribut buku berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BukuResource'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '422':
          $ref: '#/components/responses/UnprocessableProblem'

    patch:
      tags:
        - Katalog Buku
      summary: Partial Update Data Buku
      description: Memperbarui sebagian atribut buku (misalnya hanya stok atau judul).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isbn: { type: string, example: '9786020000011' }
                judul: { type: string, example: 'Judul Baru Saja' }
                stok: { type: integer, example: 15 }
      responses:
        '200':
          description: Atribut terpilih berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BukuResource'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '422':
          $ref: '#/components/responses/UnprocessableProblem'

    delete:
      tags:
        - Katalog Buku
      summary: Menghapus Buku
      description: Buku hanya dapat dihapus jika tidak memiliki peminjaman aktif.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Buku berhasil dihapus (No Content).
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          description: Konflik karena buku masih dipinjam.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/bukus/{id}/referensi-eksternal:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags:
        - REST Consumer
      summary: Mengambil Metadata Tambahan dari OpenLibrary
      description: Mengintegrasikan API eksternal OpenLibrary dengan timeout 8 detik dan fallback otomatis.
      responses:
        '200':
          description: Informasi referensi eksternal berhasil diperoleh atau fallback disajikan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  buku_local: { type: object }
                  external_source: { type: string, example: openlibrary }
                  found: { type: boolean, example: true }
                  metadata: { type: object }
                  fallback_applied: { type: boolean, example: false }
                  note: { type: string }
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /api/v1/github/repo:
    get:
      tags:
        - REST Consumer
      summary: Mengonsumsi GitHub REST API v3 (Repository Info)
      description: Mengambil data repositori dari GitHub REST API v3 dengan penyensoran token otorisasi demi keamanan.
      responses:
        '200':
          description: Data repositori berhasil diambil atau fallback disajikan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  source: { type: string, example: GitHub REST API v3 }
                  authenticated: { type: boolean, example: true }
                  token_used: { type: string, example: 'ghp_****...1234' }
                  repository: { type: object }

  /api/v1/peminjamans:
    get:
      tags:
        - Transaksi Peminjaman ACID
      summary: Menampilkan Riwayat Transaksi Peminjaman
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [dipinjam, dikembalikan] }
        - name: nim_peminjam
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Daftar peminjaman berhasil dimuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PeminjamanResource'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

    post:
      tags:
        - Transaksi Peminjaman ACID
      summary: Membuat Peminjaman Baru (ACID & Pessimistic Locking)
      description: Memeriksa ketersediaan stok, mengunci baris buku (lockForUpdate), mencegah peminjaman ganda NIM, dan mendeskremen stok secara atomik.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buku_id, nim_peminjam, nama_peminjam]
              properties:
                buku_id: { type: integer, example: 1 }
                nim_peminjam: { type: string, example: '12S24054' }
                nama_peminjam: { type: string, example: 'Rahel Silaban' }
                durasi_hari: { type: integer, default: 7, example: 7 }
      responses:
        '201':
          description: Peminjaman berhasil dibuat. Mengembalikan header Location.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PeminjamanResource'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '409':
          description: Konflik peminjaman ganda untuk NIM dan buku yang sama.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Stok buku habis.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/peminjamans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags:
        - Transaksi Peminjaman ACID
      summary: Mengambil Detail Transaksi Peminjaman
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PeminjamanResource'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /api/v1/peminjamans/{id}/kembalikan:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags:
        - Transaksi Peminjaman ACID
      summary: Mengembalikan Buku (ACID & Pessimistic Locking)
      description: Mengunci baris transaksi dan buku, memvalidasi status belum dikembalikan, mencatat tanggal kembali, dan menambahkan stok secara konsisten.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Buku berhasil dikembalikan dan stok diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PeminjamanResource'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          description: Buku sudah berstatus dikembalikan sebelumnya (mencegah double return).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          example: 'https://tools.ietf.org/html/rfc7231#section-6.5.4'
        title:
          type: string
          example: 'Not Found'
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: 'Data sumber daya yang diminta tidak ditemukan.'
        instance:
          type: string
          example: '/api/v1/bukus/999'
        invalid_params:
          type: object
          nullable: true

    LoginSuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: 'Login pustakawan berhasil. Bearer token telah diterbitkan.' }
        token_type: { type: string, example: 'Bearer' }
        access_token: { type: string, example: '1|1a2b3c4d5e6f...' }
        user:
          type: object
          properties:
            id: { type: integer, example: 1 }
            name: { type: string, example: 'Pustakawan Del' }
            email: { type: string, example: 'pustakawan@del.ac.id' }

    BukuInput:
      type: object
      required: [isbn, judul, penulis, penerbit, tahun_terbit, kategori_id, stok]
      properties:
        isbn: { type: string, example: '9786020000011' }
        judul: { type: string, example: 'Struktur Data dan Algoritma' }
        penulis: { type: string, example: 'Dosen Informatika Del' }
        penerbit: { type: string, example: 'Del Press' }
        tahun_terbit: { type: integer, example: 2024 }
        kategori_id: { type: integer, example: 1 }
        stok: { type: integer, example: 5 }
        sinopsis: { type: string, nullable: true, example: 'Buku teks standar perkuliahan.' }

    BukuResource:
      type: object
      properties:
        id: { type: integer, example: 1 }
        isbn: { type: string, example: '9786020000011' }
        judul: { type: string, example: 'Struktur Data dan Algoritma' }
        penulis: { type: string, example: 'Dosen Informatika Del' }
        penerbit: { type: string, example: 'Del Press' }
        tahun_terbit: { type: integer, example: 2024 }
        stok: { type: integer, example: 5 }
        sinopsis: { type: string, nullable: true }
        kategori_id: { type: integer, example: 1 }
        kategori:
          type: object
          properties:
            id: { type: integer, example: 1 }
            kode_kategori: { type: string, example: 'IF' }
            nama_kategori: { type: string, example: 'Informatika' }
        total_dipinjam: { type: integer, example: 2 }
        _links:
          type: object
          properties:
            self: { type: object }
            kategori: { type: object }
            referensi_eksternal: { type: object }
            pinjam_buku: { type: object, description: 'Tampil secara dinamis hanya jika stok > 0' }

    PeminjamanResource:
      type: object
      properties:
        id: { type: integer, example: 1 }
        kode_pinjam: { type: string, example: 'PJM-A1B2C3D4' }
        buku_id: { type: integer, example: 1 }
        nim_peminjam: { type: string, example: '12S24054' }
        nama_peminjam: { type: string, example: 'Rahel Silaban' }
        tanggal_pinjam: { type: string, format: date, example: '2026-11-06' }
        tanggal_jatuh_tempo: { type: string, format: date, example: '2026-11-13' }
        tanggal_kembali: { type: string, format: date, nullable: true, example: null }
        status: { type: string, enum: [dipinjam, dikembalikan], example: 'dipinjam' }
        _links:
          type: object
          properties:
            self: { type: object }
            buku: { type: object }
            kembalikan_buku: { type: object, description: 'Tampil secara dinamis hanya jika status dipinjam' }

  responses:
    UnauthorizedProblem:
      description: Tidak terautentikasi (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFoundProblem:
      description: Data tidak ditemukan (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UnprocessableProblem:
      description: Validasi input gagal atau stok habis (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
